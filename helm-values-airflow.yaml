# Airflow Helm chart 오버라이드 값 (chart apache-airflow/airflow 1.22.0 → Airflow 3.2.2)
# 기본 values 위에 "덮어쓸 것만" 정의한다. 적지 않은 키는 chart 기본값이 그대로 적용된다.
# 배포: helm install flight-airflow apache-airflow/airflow --version 1.22.0 -n airflow -f helm-values-airflow.yaml

# Task별 Pod 격리 실행 전략. (기본값은 CeleryExecutor)
executor: "KubernetesExecutor"

# Airflow 3.x의 UI/REST는 api-server가 담당한다(2.x의 webserver 대체).
# 기본 service type은 ClusterIP(클러스터 내부 전용) → NodePort로 바꿔 kind 노드의 30080 포트로 노출.
# kind-config.yaml의 extraPortMappings(host 8080 → node 30080)와 연결되어 브라우저 localhost:8080으로 접근.
apiServer:
  service:
    type: NodePort
    ports:
      - name: api-server
        port: "{{ .Values.ports.apiServer }}"
        nodePort: 30080
