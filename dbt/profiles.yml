# DB 연결 정보. dbt_project.yml의 profile 키('flight_data')와 최상위 키가 일치해야 한다.
# 프로젝트 로컬에 두고 --profiles-dir로 가리켜 repo 하나로 자족적(self-contained). 학습/포트폴리오 유리.
#
# target 분리(현업 표준):
#  - dev  = OAuth(gcloud ADC). 로컬 개발. SA 키 파일을 로컬에 두지 않음(키 유출 방지).
#  - prod = service-account. 나중에 Airflow에서 dbt 실행 시(#27) 추가.
flight_data:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth              # gcloud application-default credentials 사용
      project: flight-data-lab-501011
      dataset: flight_data       # 기본 스키마(source가 참조하는 bronze 위치). staging/marts는 +schema로 분리
      location: asia-northeast3
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1
