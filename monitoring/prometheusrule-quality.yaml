# 데이터 품질 알림 규칙 (#50, 5단계). Baseline 임계 → 발화.
# operator가 이 CRD를 Prometheus에 자동 반영(선언적). 발화 알림은 Alertmanager로.
# ★오탐 없음 실증(2026-07-26): bronze는 하루당기기로 완결된 날만 담김(오늘 0행, 적재 지연 정확히 1일)
#   → snapshots/coverage 규칙에 "진행 중이라 낮은" 오탐 없음.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: quality-alerts
  namespace: monitoring
  labels:
    app: quality-exporter
    role: alert-rules
spec:
  groups:
    - name: flight-data-quality
      rules:
        # 신선도: 이틀(48h) 넘게 적재 없으면 적재 파이프라인 장애.
        - alert: BronzeStale
          expr: flight_bronze_freshness_seconds > 172800
          for: 10m
          labels: { team: flight-data, severity: critical }
          annotations:
            summary: "bronze 적재 정체 (48h+)"
            description: "마지막 적재 후 {{ $value | humanizeDuration }} 경과 — 적재 DAG 확인 필요."
        # exporter 파드 자체가 죽음(Prometheus가 scrape 못 함).
        - alert: QualityExporterDown
          expr: up{job="quality-exporter"} == 0
          for: 5m
          labels: { team: flight-data, severity: critical }
          annotations:
            summary: "품질 exporter 다운"
            description: "quality-exporter를 5분간 scrape 실패 — 파드/서비스 확인."
        # exporter는 살아있으나 BQ 조회가 실패(권한·쿼리·BQ 장애).
        - alert: BQQueryFailed
          expr: flight_exporter_query_success == 0
          for: 10m
          labels: { team: flight-data, severity: warning }
          annotations:
            summary: "exporter BQ 조회 실패"
            description: "exporter가 BQ 조회에 실패 중 — 메트릭이 갱신되지 않음."
        # 완결성: 완결된 날 중 하나라도 스냅샷 < 115(=144×80%)면 수집 부족.
        - alert: SnapshotIncomplete
          expr: min(flight_bronze_snapshots_total) < 115
          for: 10m
          labels: { team: flight-data, severity: warning }
          annotations:
            summary: "일별 스냅샷 부족 (<115)"
            description: "완결된 날 중 스냅샷이 115 미만 — 수집 누락 의심."
        # 완결도: 관심 영역 중 하나라도 coverage < 0.8이면 그날 데이터 신뢰도 낮음.
        - alert: LowCoverage
          expr: min(flight_coverage_ratio) < 0.8
          for: 10m
          labels: { team: flight-data, severity: warning }
          annotations:
            summary: "완결도 낮음 (<0.8)"
            description: "region 완결도가 0.8 미만 — 해당 날짜 분석 신뢰도 주의."
