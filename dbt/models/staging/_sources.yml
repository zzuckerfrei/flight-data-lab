version: 2

# source = dbt가 참조하는 '외부 원천'(dbt 밖에서 온 데이터). dbt가 적재하지 않고 위치만 가리킨다.
# 우리 bronze는 Airflow가 이미 BigQuery에 적재해둔 실제 테이블 → database/schema로 좌표만 선언.
# (사이클1 duckdb는 meta.external_location으로 CSV를 읽었지만, BQ는 실테이블 참조라 방식이 다름.)
# 모델에서 {{ source('bronze', 'opensky_states_bronze') }}로 참조하면
#   dbt가 실행 순서(이 source → staging)를 자동으로 안다.
sources:
  - name: bronze
    description: "Airflow가 GCS raw JSON을 적재한 BigQuery bronze 레이어(스냅샷 통짜 보존)"
    database: flight-data-lab-501011   # BigQuery project
    schema: flight_data                # BigQuery dataset
    tables:
      - name: opensky_states_bronze
        description: "1행 = 1스냅샷(region+snapshot_time). raw(JSON)에 항공기 배열 통짜 보존."
        columns:
          - name: snapshot_time
            description: "스냅샷 시각(OpenSky time epoch → TIMESTAMP). 파티션 컬럼."
          - name: region
            description: "수집 영역(ukraine/middle_east/west_europe/korea)."
          - name: raw
            description: "OpenSky /states/all 응답 원본(JSON). states=항공기 17필드 배열의 배열."
          - name: _loaded_at
            description: "BQ 적재 시각(관측성·freshness 기준)."
    # freshness(최신성 체크)는 적재 자동화(#28) 후 추가 — 지금은 수동 적재라 상시 stale 경고.
