version: 2

# marts 모델의 문서 + 데이터 품질 테스트.
# 핵심 지표 density가 비어있거나(집계 누락) 음수(로직 오류)면 안 된다.
models:
  - name: mart_region_density
    description: >
      영역·스냅샷별 항공기 밀도(면적 정규화). 분쟁지역 영공 회피의 정량 지표.
      density = 공중 항공기 수 / 영역 면적(sq°). 1행 = 1스냅샷 × 1영역.
      stg_states(항공기 1행) + region_area(seed, 면적)를 조인·집계한 gold 레이어.
    columns:
      - name: snapshot_time
        description: "스냅샷 시각(TIMESTAMP)."
        data_tests:
          - not_null
      - name: region
        description: "수집 영역."
        data_tests:
          - not_null
          - accepted_values:
              values: ['ukraine', 'middle_east', 'west_europe']
      - name: aircraft_count
        description: "공중 항공기 수(on_ground=false). 음수 불가."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: area_sqdeg
        description: "영역 면적(seed에서 조인). 양수여야 밀도 분모로 유효."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: density
        description: "면적 정규화 밀도 = aircraft_count / area_sqdeg. ★ 핵심 지표. 음수 불가."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

  - name: mart_aircraft_points
    description: >
      지도(Kepler.gl)용 항공기 위치 점. 1행 = 1항공기 × 1스냅샷(30분 버킷).
      stg_states에서 공중(on_ground=false)·좌표 있는 행만 추린 소비 mart.
      region_density(집계 숫자)와 달리 위경도를 살려 지도 점 구름/공백을 렌더한다.
    columns:
      - name: snapshot_bucket
        description: "30분 버킷 시각(애니메이션 프레임 키). 4영역 정렬용 floor."
        data_tests:
          - not_null
      - name: region
        description: "수집 영역."
        data_tests:
          - not_null
          - accepted_values:
              values: ['ukraine', 'middle_east', 'west_europe', 'other']
      - name: longitude
        description: "경도. 지도 X. 물리 유효 범위 [-180, 180]."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: -180
              max_value: 180
      - name: latitude
        description: "위도. 지도 Y. 물리 유효 범위 [-90, 90]."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: -90
              max_value: 90

  - name: mart_grid_density
    description: >
      격자 밀도 소비용 gold 테이블(Kepler 히트맵·Grafana 추세가 읽음).
      int_grid_density(0.5° 격자 셀별 항공기 수) + 날짜별 coverage_pct를 노출.
      1행 = (날짜 × 셀 × region). region 단위 밀도(mart_region_density)를 격자로 세분화한 뷰.
    columns:
      - name: dt
        description: "날짜(UTC)."
        data_tests:
          - not_null
      - name: region
        description: "관심 영역 태그(other 포함)."
        data_tests:
          - not_null
          - accepted_values:
              values: ['ukraine', 'middle_east', 'west_europe', 'other']
      - name: cell_lon
        description: "셀 좌측하단 경도 [-10, 70]."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: -10
              max_value: 70
      - name: cell_lat
        description: "셀 좌측하단 위도 [18, 60]."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 18
              max_value: 60
      - name: aircraft_count
        description: "셀당 항공기 수. 음수·0 불가."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
      - name: coverage_pct
        description: >
          그날 수집 완결도(1.0=144 스냅샷 다 옴). 소비자 신뢰도 메타.
          ★ 옛 4분할 수집기(7/5~21)는 region마다 snapshot_time이 미세하게 어긋나
          하루 distinct 스냅샷이 144를 넘어 1.0을 초과(최대 ~2.04) — 알려진 경계 구간 특성.
          따라서 상한은 검증하지 않고 음수 불가만 확인(mart_region_density와 동일 계산).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
